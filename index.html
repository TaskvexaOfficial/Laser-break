<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Laser Break</title>
    <style>
        :root {
            --cyan: #00FFFF;
            --blue: #0055FF;
            --dark-blue: #1E1B4B;
            --danger: #1E293B;
            --danger-top: #334155;
            --danger-edge: #0F172A;
            --panel-bg: rgba(30, 41, 59, 0.85);
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0F172A;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        #bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, var(--cyan), var(--blue), var(--dark-blue));
            z-index: 1;
        }
        canvas {
            display: block; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 2;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            display: flex; flex-direction: column;
        }
        /* UI Elements */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .screen.active {
            opacity: 1; pointer-events: auto;
        }
        
        .title {
            color: white; font-size: 56px; font-weight: 900; text-align: center;
            line-height: 0.9; margin-bottom: 20px;
            text-shadow: 0 8px 8px rgba(0,0,128,0.5);
        }
        .title span { color: var(--cyan); }
        
        .btn {
            background: linear-gradient(to bottom, #00FFFF, #0055FF);
            border: 2px solid #E0FFFF; border-radius: 40px;
            color: white; font-size: 32px; font-weight: 900;
            padding: 15px 60px; cursor: pointer; pointer-events: auto;
            box-shadow: 0 10px 20px rgba(0,255,255,0.3);
            text-shadow: 0 4px 4px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-outline {
            background: transparent;
            border: 2px solid white; border-radius: 12px;
            color: white; font-size: 18px; font-weight: bold;
            padding: 15px 30px; cursor: pointer; pointer-events: auto;
            margin-top: 15px; width: 200px;
        }
        
        .hud-top {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none;
        }
        .gem-pill {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 24px; padding: 10px 20px;
            display: flex; align-items: center; gap: 8px;
            color: white; font-weight: bold; font-size: 18px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .diamond-icon {
            width: 20px; height: 20px;
            background: var(--cyan);
            clip-path: polygon(50% 0%, 100% 25%, 50% 100%, 0% 25%);
        }
        
        .icon-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(0, 191, 255, 0.5);
            border-radius: 50%; width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 20px; cursor: pointer; pointer-events: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        
        .panel {
            background: var(--panel-bg);
            border-radius: 24px; padding: 30px; width: 300px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        
        .hold-instruction {
            position: absolute; bottom: 120px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px; padding: 12px 24px;
            color: white; font-weight: bold; font-size: 18px;
            pointer-events: none; transition: opacity 0.3s;
        }

        #splash { background: #0F172A; z-index: 10; }
        #splash .title { margin-bottom: 10px; }
        #splash p { color: rgba(255,255,255,0.7); }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 5;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #overlay.active { opacity: 1; pointer-events: auto; }
        
        .dots-row { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.5); }
        .dot.active { width: 12px; height: 12px; background: #FF4444; box-shadow: 0 0 8px #FF4444; }
        
    </style>
</head>
<body>
    <div id="bg"></div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <!-- Splash Screen -->
        <div id="splash" class="screen active">
            <div class="title">LASER<br><span>BREAK</span></div>
            <p>A TaskVexa Game</p>
        </div>
        
        <!-- Main Menu -->
        <div id="menu" class="screen">
            <div class="hud-top">
                <div class="gem-pill"><div class="diamond-icon"></div> <span id="menu-gems">0</span></div>
                <div class="icon-btn" onclick="toggleSound()">🔊</div>
            </div>
            
            <div style="height: 250px;"></div>
            
            <div class="title" style="margin-top: 30px;">LASER<br><span>BREAK</span></div>
            
            <div class="btn" style="margin-top: 20px;" onclick="startGame()">PLAY</div>
            
            <p style="color: rgba(255,255,255,0.9); margin-top: 40px; font-weight: 500; font-size: 16px;">Hold to break. Release to stay safe.</p>
            <div class="dots-row">
                <div class="dot"></div><div class="dot active"></div><div class="dot"></div>
            </div>
            <p style="color: rgba(255,255,255,0.7); font-size: 14px; margin: 0;">A TaskVexa Game</p>
        </div>
        
        <!-- Game HUD -->
        <div id="game-hud" class="screen">
            <div class="hud-top">
                <div class="gem-pill"><div class="diamond-icon"></div> <span id="game-gems">0</span></div>
                <div class="icon-btn" onclick="pauseGame()">⏸</div>
            </div>
            <div id="hold-text" class="hold-instruction">HOLD TO BREAK</div>
        </div>
        
        <!-- Overlay (Result / Pause) -->
        <div id="overlay">
            <div class="panel" id="result-panel" style="display: none;">
                <h2 id="result-title" style="color: white; font-weight: 900; margin-top: 0;">CORE BROKEN!</h2>
                <div id="result-reward" class="gem-pill" style="margin: 15px 0;"><div class="diamond-icon"></div> <span style="color: var(--cyan);">+10 GEMS</span></div>
                <p style="color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 25px;">TOTAL GEMS: <span id="result-total">0</span></p>
                <div class="btn" style="width: 100%; box-sizing: border-box; text-align: center; font-size: 20px; padding: 15px;" onclick="startGame()">PLAY AGAIN</div>
                <div class="btn-outline" style="width: 100%; box-sizing: border-box; text-align: center;" onclick="goHome()">HOME</div>
            </div>
            
            <div class="panel" id="pause-panel" style="display: none;">
                <h2 style="color: white; font-weight: 900; margin-top: 0; font-size: 32px;">PAUSED</h2>
                <div class="btn" style="width: 100%; box-sizing: border-box; text-align: center; font-size: 20px; padding: 15px; margin-top: 20px;" onclick="resumeGame()">RESUME</div>
                <div class="btn-outline" style="width: 100%; box-sizing: border-box; text-align: center;" onclick="goHome()">HOME</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Game State
        let gems = parseInt(localStorage.getItem('demo_gems')) || 0;
        let gameState = 'SPLASH'; // SPLASH, MENU, PLAYING, PAUSED, OVER
        let structure = null;
        let particles = [];
        let isFiring = false;
        let lastTime = 0;
        let shakeX = 0, shakeY = 0;
        let laserTipY = 0;
        let showHoldText = true;
        let soundEnabled = true;
        
        const THEMES = [
            { primary: '#00BFFF', secondary: '#1E90FF', glow: '#87CEFA', danger: '#1E293B', dangerTop: '#334155', dangerEdge: '#0F172A' },
            { primary: '#00FFFF', secondary: '#00CED1', glow: '#E0FFFF', danger: '#1E293B', dangerTop: '#334155', dangerEdge: '#0F172A' },
            { primary: '#9370DB', secondary: '#8A2BE2', glow: '#D8BFD8', danger: '#1E293B', dangerTop: '#334155', dangerEdge: '#0F172A' },
            { primary: '#FF69B4', secondary: '#FF1493', glow: '#FFB6C1', danger: '#1E293B', dangerTop: '#334155', dangerEdge: '#0F172A' }
        ];
        
        function updateGems(amount) {
            gems += amount;
            localStorage.setItem('demo_gems', gems);
            document.getElementById('menu-gems').innerText = gems;
            document.getElementById('game-gems').innerText = gems;
            document.getElementById('result-total').innerText = gems;
        }
        updateGems(0);
        
        function setScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if(id) document.getElementById(id).classList.add('active');
        }
        
        function showOverlay(panelId) {
            document.getElementById('overlay').classList.add('active');
            document.getElementById('result-panel').style.display = 'none';
            document.getElementById('pause-panel').style.display = 'none';
            if(panelId) document.getElementById(panelId).style.display = 'flex';
        }
        function hideOverlay() {
            document.getElementById('overlay').classList.remove('active');
        }
        
        // Input handling
        function handlePointerDown(e) {
            if (gameState === 'PLAYING') {
                isFiring = true;
                if(showHoldText) {
                    showHoldText = false;
                    document.getElementById('hold-text').style.opacity = '0';
                }
            }
        }
        function handlePointerUp(e) {
            isFiring = false;
        }
        
        document.addEventListener('mousedown', handlePointerDown);
        document.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(); }, {passive: false});
        document.addEventListener('mouseup', handlePointerUp);
        document.addEventListener('touchend', handlePointerUp);
        
        function generateStructure() {
            const types = ['circle', 'hexagon', 'triangle', 'square'];
            const type = types[Math.floor(Math.random() * types.length)];
            const numLayers = 2 + Math.floor(Math.random() * 3); // 2 to 4
            const theme = THEMES[Math.floor(Math.random() * THEMES.length)];
            
            let layers = [];
            let currentRadius = 160;
            const thickness = 40;
            const gap = 15;
            
            for (let i = 0; i < numLayers; i++) {
                let numSegments = 6;
                if (type === 'circle') numSegments = 2 + Math.floor(Math.random() * 7);
                else if (type === 'triangle') numSegments = 3;
                else if (type === 'square') numSegments = 4;
                
                let segments = [];
                let angleStep = (Math.PI * 2) / numSegments;
                let safeIndex = Math.floor(Math.random() * numSegments);
                
                for (let j = 0; j < numSegments; j++) {
                    let isDanger = (j !== safeIndex) && (Math.random() < 0.3);
                    segments.push({
                        startAngle: j * angleStep + 0.05,
                        sweepAngle: angleStep - 0.1,
                        isDanger: isDanger,
                        health: 100,
                        destroyed: false
                    });
                }
                
                layers.push({
                    radius: currentRadius,
                    thickness: thickness,
                    segments: segments,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() * 1.5 + 0.5) * (Math.random() > 0.5 ? 1 : -1)
                });
                
                currentRadius -= (thickness + gap);
            }
            
            return { type, layers, theme };
        }
        
        // Dummy structure for menu
        let menuStructure = {
            type: 'circle', theme: THEMES[0],
            layers: [
                { radius: 130, thickness: 40, rotation: 0, rotSpeed: 0.5, segments: [
                    {startAngle: 0, sweepAngle: 1, isDanger: false, health:100, destroyed: false},
                    {startAngle: 1.2, sweepAngle: 2, isDanger: true, health:100, destroyed: false},
                    {startAngle: 3.4, sweepAngle: 2.5, isDanger: false, health:100, destroyed: false}
                ]},
                { radius: 75, thickness: 40, rotation: -1, rotSpeed: -0.8, segments: [
                    {startAngle: 0.5, sweepAngle: 1.5, isDanger: true, health:100, destroyed: false},
                    {startAngle: 2.2, sweepAngle: 2, isDanger: false, health:100, destroyed: false},
                    {startAngle: 4.5, sweepAngle: 1.5, isDanger: false, health:100, destroyed: false}
                ]}
            ]
        };
        
        function startGame() {
            structure = generateStructure();
            particles = [];
            gameState = 'PLAYING';
            isFiring = false;
            showHoldText = true;
            document.getElementById('hold-text').style.opacity = '1';
            setScreen('game-hud');
            hideOverlay();
            lastTime = performance.now();
        }
        
        function pauseGame() {
            gameState = 'PAUSED';
            isFiring = false;
            showOverlay('pause-panel');
        }
        
        function resumeGame() {
            gameState = 'PLAYING';
            lastTime = performance.now();
            hideOverlay();
        }
        
        function goHome() {
            gameState = 'MENU';
            setScreen('menu');
            hideOverlay();
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.querySelector('.icon-btn');
            btn.innerText = soundEnabled ? '🔊' : '🔇';
        }
        
        function vibrate(duration) {
            if (navigator.vibrate) navigator.vibrate(duration);
        }
        
        function drawArcSegment(ctx, cx, cy, innerR, outerR, start, sweep) {
            ctx.beginPath();
            ctx.arc(cx, cy, innerR, start, start + sweep);
            ctx.arc(cx, cy, outerR, start + sweep, start, true);
            ctx.closePath();
        }
        
        function drawLineSegment(ctx, cx, cy, innerR, outerR, start, sweep) {
            let end = start + sweep;
            ctx.beginPath();
            ctx.moveTo(cx + innerR * Math.cos(start), cy + innerR * Math.sin(start));
            ctx.lineTo(cx + innerR * Math.cos(end), cy + innerR * Math.sin(end));
            ctx.lineTo(cx + outerR * Math.cos(end), cy + outerR * Math.sin(end));
            ctx.lineTo(cx + outerR * Math.cos(start), cy + outerR * Math.sin(start));
            ctx.closePath();
        }
        
        function update(dt) {
            if (gameState !== 'PLAYING' && gameState !== 'MENU') return;
            
            let s = gameState === 'MENU' ? menuStructure : structure;
            if (!s) return;
            
            let hitRadius = 0;
            let hitSegment = null;
            
            // Update rotation
            s.layers.forEach(layer => {
                layer.rotation += layer.rotSpeed * dt;
            });
            
            if (gameState === 'PLAYING' && isFiring) {
                // Laser fires straight up (angle -Math.PI/2 in canvas coordinates where Y is down)
                // However, the structure is drawn at cy, and laser comes from cannonY > cy.
                // It approaches from the bottom, which is Math.PI/2 in standard angles if center is (0,0) and Y goes down.
                let laserAngle = Math.PI / 2;
                
                for (let i = s.layers.length - 1; i >= 0; i--) {
                    let layer = s.layers[i];
                    let localAngle = (laserAngle - layer.rotation) % (Math.PI * 2);
                    if (localAngle < 0) localAngle += Math.PI * 2;
                    
                    let hit = layer.segments.find(seg => !seg.destroyed && localAngle >= seg.startAngle && localAngle <= (seg.startAngle + seg.sweepAngle));
                    if (hit) {
                        hitSegment = hit;
                        hitRadius = layer.radius + layer.thickness/2;
                        
                        if (hit.isDanger) {
                            // Game Over
                            gameState = 'LOST';
                            vibrate([0, 100, 50, 200]);
                            setTimeout(() => {
                                document.getElementById('result-title').innerText = "LASER OVERLOADED";
                                document.getElementById('result-title').style.color = "#FF4444";
                                document.getElementById('result-reward').style.display = "none";
                                showOverlay('result-panel');
                            }, 500);
                        } else {
                            // Damage
                            hit.health -= 250 * dt;
                            if (hit.health <= 0) {
                                hit.destroyed = true;
                            }
                        }
                        break;
                    }
                }
            }
            
            if (gameState === 'PLAYING' && !hitSegment && isFiring) {
                hitRadius = 24; // hit core
            }
            
            laserTipY = hitRadius;
            
            shakeX = 0; shakeY = 0;
            if (gameState === 'PLAYING' && isFiring && hitSegment && !hitSegment.isDanger) {
                shakeX = (Math.random() - 0.5) * 6;
                shakeY = (Math.random() - 0.5) * 6;
                
                // Spawn particles
                if (Math.random() < 0.5) {
                    particles.push({
                        x: 0, y: hitRadius,
                        vx: (Math.random() - 0.5) * 200,
                        vy: Math.random() * 100 + 100,
                        life: 1,
                        color: s.theme.glow
                    });
                }
            }
            
            // Check win
            if (gameState === 'PLAYING') {
                let allSafeDestroyed = true;
                s.layers.forEach(layer => {
                    layer.segments.forEach(seg => {
                        if (!seg.isDanger && !seg.destroyed) allSafeDestroyed = false;
                    });
                });
                if (allSafeDestroyed) {
                    gameState = 'WON';
                    updateGems(10);
                    vibrate(100);
                    setTimeout(() => {
                        document.getElementById('result-title').innerText = "CORE BROKEN!";
                        document.getElementById('result-title').style.color = "white";
                        document.getElementById('result-reward').style.display = "flex";
                        showOverlay('result-panel');
                    }, 500);
                }
            }
            
            // Update particles
            particles.forEach(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2;
            });
            particles = particles.filter(p => p.life > 0);
        }
        
        function render() {
            ctx.clearRect(0, 0, width, height);
            
            let s = gameState === 'MENU' ? menuStructure : structure;
            if (!s) return;
            
            // Background energy rings
            let cxBase = width / 2;
            let cyBase = gameState === 'MENU' ? height / 2 - 120 : height / 2 - 120;
            
            ctx.fillStyle = 'rgba(0, 191, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(cxBase, cyBase, width * 0.8, 0, Math.PI*2);
            ctx.fill();
            
            for(let i=1; i<=4; i++) {
                ctx.beginPath();
                ctx.arc(cxBase, cyBase, i*120, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            let cx = cxBase + shakeX;
            let cy = cyBase + shakeY;
            let cannonY = height - 80;
            
            // Draw Layers
            s.layers.slice().reverse().forEach(layer => {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(layer.rotation);
                
                layer.segments.forEach(seg => {
                    if (seg.destroyed) return;
                    
                    let innerR = layer.radius - layer.thickness / 2;
                    let outerR = layer.radius + layer.thickness / 2;
                    
                    if (s.type === 'circle' || gameState === 'MENU') {
                        drawArcSegment(ctx, 0, 0, innerR, outerR, seg.startAngle, seg.sweepAngle);
                    } else {
                        drawLineSegment(ctx, 0, 0, innerR, outerR, seg.startAngle, seg.sweepAngle);
                    }
                    
                    let isDanger = seg.isDanger;
                    
                    // Base fill gradient for depth
                    let midAngle = seg.startAngle + seg.sweepAngle/2;
                    let grad = ctx.createLinearGradient(
                        innerR * Math.cos(midAngle), innerR * Math.sin(midAngle),
                        outerR * Math.cos(midAngle), outerR * Math.sin(midAngle)
                    );
                    
                    if (isDanger) {
                        grad.addColorStop(0, s.theme.dangerTop);
                        grad.addColorStop(0.5, s.theme.danger);
                        grad.addColorStop(1, s.theme.dangerEdge);
                    } else {
                        grad.addColorStop(0, s.theme.glow);
                        grad.addColorStop(0.5, s.theme.primary);
                        grad.addColorStop(1, s.theme.secondary);
                    }
                    
                    ctx.fillStyle = grad;
                    ctx.fill();
                    
                    // Highlight edge
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = isDanger ? '#475569' : 'rgba(255,255,255,0.6)';
                    ctx.stroke();
                    
                    // Cracks if damaged
                    if (!isDanger && seg.health < 50) {
                        ctx.beginPath();
                        ctx.moveTo((innerR+5) * Math.cos(midAngle), (innerR+5) * Math.sin(midAngle));
                        ctx.lineTo((outerR-5) * Math.cos(midAngle + 0.1), (outerR-5) * Math.sin(midAngle + 0.1));
                        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                });
                
                ctx.restore();
            });
            
            // Core
            ctx.beginPath();
            ctx.arc(cx, cy, 24, 0, Math.PI*2);
            ctx.fillStyle = 'white';
            ctx.fill();
            
            let coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80);
            coreGrad.addColorStop(0, 'rgba(255,255,255,0.8)');
            coreGrad.addColorStop(0.3, s.theme.glow);
            coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(cx, cy, 80, 0, Math.PI*2);
            ctx.fillStyle = coreGrad;
            ctx.fill();
            
            // Core Rays
            if ((gameState === 'PLAYING' || gameState === 'MENU') && isFiring) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((performance.now() / 1000) * 2);
                for(let i=0; i<8; i++) {
                    ctx.rotate(Math.PI / 4);
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.lineTo(40, 0);
                    ctx.strokeStyle = s.theme.glow;
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                ctx.restore();
            }
            
            if (gameState !== 'MENU') {
                // Laser
                if (isFiring && laserTipY > 0) {
                    let targetY = cy + laserTipY;
                    
                    // Laser Beam Glow
                    ctx.beginPath();
                    ctx.moveTo(cx, cannonY);
                    ctx.lineTo(cx, targetY);
                    ctx.strokeStyle = 'rgba(255, 20, 147, 0.5)';
                    ctx.lineWidth = 24;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    
                    // Laser Beam Core
                    ctx.beginPath();
                    ctx.moveTo(cx, cannonY);
                    ctx.lineTo(cx, targetY);
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 8;
                    ctx.stroke();
                    
                    // Impact
                    ctx.beginPath();
                    ctx.arc(cx, targetY, 16, 0, Math.PI*2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(cx, targetY, 32, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255, 20, 147, 0.8)';
                    ctx.fill();
                }
                
                // Cannon Base
                let baseR = 40;
                
                // Cannon Underglow
                ctx.beginPath();
                ctx.arc(cx, cannonY, baseR * 1.5, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(0, 191, 255, 0.3)';
                ctx.fill();
                
                // Cannon Body
                let cg = ctx.createRadialGradient(cx, cannonY, 0, cx, cannonY, baseR);
                cg.addColorStop(0, '#0055FF');
                cg.addColorStop(1, '#0F172A');
                ctx.beginPath();
                ctx.arc(cx, cannonY, baseR, 0, Math.PI*2);
                ctx.fillStyle = cg;
                ctx.fill();
                
                // Cannon Ring
                ctx.beginPath();
                ctx.arc(cx, cannonY, baseR * 0.7, 0, Math.PI*2);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 8;
                ctx.stroke();
                
                // Cannon Lens
                ctx.beginPath();
                ctx.arc(cx, cannonY, baseR * 0.4, 0, Math.PI*2);
                ctx.fillStyle = '#FF4444';
                ctx.fill();
                
                // Cannon Nozzle
                ctx.beginPath();
                ctx.moveTo(cx - 16, cannonY - baseR * 0.8);
                ctx.lineTo(cx + 16, cannonY - baseR * 0.8);
                ctx.lineTo(cx + 10, cannonY - baseR * 1.2);
                ctx.lineTo(cx - 10, cannonY - baseR * 1.2);
                ctx.closePath();
                let ng = ctx.createLinearGradient(0, cannonY - baseR * 1.2, 0, cannonY - baseR * 0.8);
                ng.addColorStop(0, '#00BFFF');
                ng.addColorStop(1, '#1E293B');
                ctx.fillStyle = ng;
                ctx.fill();
            } else {
                // In menu, maybe draw a horizontal laser crossing the structure
                ctx.beginPath();
                ctx.moveTo(0, cy);
                ctx.lineTo(width, cy);
                ctx.strokeStyle = 'rgba(255, 20, 147, 0.3)';
                ctx.lineWidth = 12;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, cy);
                ctx.lineTo(width, cy);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            
            // Particles
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(cx + p.x, cy + p.y, 4 * p.life, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,255,255,${p.life})`;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(cx + p.x, cy + p.y, 12 * p.life, 0, Math.PI*2);
                ctx.globalAlpha = p.life * 0.5;
                ctx.fillStyle = p.color; 
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }
        
        function gameLoop(t) {
            requestAnimationFrame(gameLoop);
            let dt = (t - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; // cap
            lastTime = t;
            
            update(dt);
            render();
        }
        
        // Init
        setTimeout(() => {
            setScreen('menu');
            isFiring = true; // For menu visual
        }, 1500); // splash duration
        
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
        
    </script>
</body>
</html>
