name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Valid Audio Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/res/raw/
          gh release download audio-assets-v1 -p "background_music.mp3" --clobber -D app/src/main/res/raw/
          gh release download audio-assets-v1 -p "laser_beam.mp3" --clobber -D app/src/main/res/raw/
          if [ ! -s app/src/main/res/raw/background_music.mp3 ] || [ ! -s app/src/main/res/raw/laser_beam.mp3 ]; then
            echo "Error: Audio files are missing or empty."
            exit 1
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LaserBreak-Signed-Release-APK
          path: app/build/outputs/apk/release/**/*.apk
          retention-days: 30
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LaserBreak-Debug-Test-APK
          path: app/build/outputs/apk/debug/**/*.apk
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: rm -f my-upload-key.jks
      - name: Cleanup Debug Keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/debug.keystore"
