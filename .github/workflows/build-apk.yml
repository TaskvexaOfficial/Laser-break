name: Build Audio Verified APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Original Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show Exact Source Commit
        run: |
          echo "Building source commit: $GITHUB_SHA"
          git log -1 --oneline

      - name: Verify Real Audio Files
        shell: bash
        run: |
          set -euo pipefail

          MUSIC="app/src/main/res/raw/background_music.mp3"
          LASER="app/src/main/res/raw/laser_beam.mp3"

          if [ ! -s "$MUSIC" ]; then
            echo "ERROR: background_music.mp3 is missing or empty."
            exit 1
          fi

          if [ ! -s "$LASER" ]; then
            echo "ERROR: laser_beam.mp3 is missing or empty."
            exit 1
          fi

          echo "Both audio files exist in the original repository:"
          ls -lh "$MUSIC" "$LASER"
          file "$MUSIC" "$LASER"

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Debug Keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -noprompt \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
          cache-provider: basic

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Audio Inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "Generated APK: $APK_FILE"
          unzip -l "$APK_FILE" > apk-contents.txt

          if ! grep -q "res/raw/background_music.mp3" apk-contents.txt; then
            echo "ERROR: Background music is not packaged inside the APK."
            exit 1
          fi

          if ! grep -q "res/raw/laser_beam.mp3" apk-contents.txt; then
            echo "ERROR: Laser sound is not packaged inside the APK."
            exit 1
          fi

          echo "SUCCESS: Both audio files are packaged inside the APK."
          ls -lh "$APK_FILE"

      - name: Upload Verified APK
        uses: actions/upload-artifact@v4
        with:
          name: LaserBreak-Audio-Verified-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
