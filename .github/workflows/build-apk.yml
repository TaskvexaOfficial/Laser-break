name: Build Audio Verified APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify audio files
        shell: bash
        run: |
          test -s app/src/main/res/raw/background_music.mp3
          test -s app/src/main/res/raw/laser_beam.mp3
          echo "Both audio files found successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v -noprompt \
          -keystore "$GITHUB_WORKSPACE/debug.keystore" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
          cache-provider: basic

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify audio inside APK
        shell: bash
        run: |
          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          unzip -l "$APK_FILE" > apk-contents.txt

          grep -q "background_music.mp3" apk-contents.txt
          grep -q "laser_beam.mp3" apk-contents.txt

          echo "SUCCESS: Both audio files are inside the APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: LaserBreak-Audio-Verified-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
